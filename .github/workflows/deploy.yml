name: Marp スライドを GitHub Pages にデプロイ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Marp CLI でスライドをビルド
        run: |
          mkdir -p dist
          npx --yes @marp-team/marp-cli@latest --html --allow-local-files 1_overview.md -o dist/1_overview.html
          npx --yes @marp-team/marp-cli@latest --html --allow-local-files 2_usage.md -o dist/2_usage.html

      - name: index.html を生成
        run: |
          cat > dist/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>agile-board スライド資料</title>
            <style>
              body { font-family: sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; }
              h1 { font-size: 1.5rem; margin-bottom: 8px; }
              p { color: #666; margin-bottom: 32px; }
              ul { list-style: none; padding: 0; }
              li { margin-bottom: 16px; }
              a { display: block; padding: 16px 20px; border: 1px solid #ddd; border-radius: 8px;
                  text-decoration: none; color: #333; }
              a:hover { background: #f5f5f5; }
              .title { font-weight: bold; margin-bottom: 4px; }
              .desc { font-size: 0.875rem; color: #666; }
            </style>
          </head>
          <body>
            <h1>agile-board スライド資料</h1>
            <p>エンジニア向けドキュメント</p>
            <ul>
              <li>
                <a href="1_overview.html">
                  <div class="title">1. 基本概念</div>
                  <div class="desc">データモデル・同期フロー・ベロシティ計算など</div>
                </a>
              </li>
              <li>
                <a href="2_usage.html">
                  <div class="title">2. 使い方ガイド</div>
                  <div class="desc">セットアップから各画面の操作手順まで</div>
                </a>
              </li>
            </ul>
          </body>
          </html>
          EOF

      - name: GitHub Pages 用アーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages にデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
